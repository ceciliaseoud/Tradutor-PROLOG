<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tradutor PROLOG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#ide">Pular para o ambiente Prolog</a>

  <div class="retro-ribbon" aria-hidden="true"></div>

  <header class="top" aria-label="Barra principal do tradutor">
    <h1 id="titulo-principal" class="top-title">Tradutor PROLOG</h1>

    <div class="top-actions">
      <button id="topCompilar" type="button" class="b verde">Compilar</button>
      <button id="topExecutar" type="button" class="b rosa">Executar consulta</button>
      <button id="topLimpar" type="button" class="b creme">Limpar saída</button>
    </div>
  </header>

  <main>
    <section aria-labelledby="sec-exemplos">
      <div class="rowhead">
        <h2 id="sec-exemplos">01 / Exemplos</h2>
      </div>

      <div class="card pad example-picker">
        <div class="seg example-seg" role="group" aria-label="Modo do editor e exemplos de Prolog">
          <button type="button" class="ex-btn on" data-ex="personalizado" aria-pressed="true">
            <span class="ex-dot lil" aria-hidden="true"></span>
            Personalizado
          </button>
          <button type="button" class="ex-btn" data-ex="valido" aria-pressed="false">
            <span class="ex-dot verde" aria-hidden="true"></span>
            Programa válido
          </button>
          <button type="button" class="ex-btn" data-ex="erro-lexico" aria-pressed="false">
            <span class="ex-dot ouro" aria-hidden="true"></span>
            Erro léxico
          </button>
          <button type="button" class="ex-btn" data-ex="erro-sintatico" aria-pressed="false">
            <span class="ex-dot coral" aria-hidden="true"></span>
            Erro sintático
          </button>
        </div>
      </div>
    </section>

    <section id="ide" aria-labelledby="sec-ide">
      <div class="rowhead">
        <h2 id="sec-ide">02 / Ambiente de Programação</h2>
      </div>

      <div class="ide-grid">
        <!-- COLUNA ESQUERDA: EDITOR PROLOG + COMPILAR -->
        <article class="card win win-editor" aria-labelledby="tit-editor">
          <header class="win-bar bg-amarelo">
            <div class="win-title">
              <span class="win-icon" aria-hidden="true">✎</span>
              <h3 id="tit-editor">Editor Prolog</h3>
              <span class="win-file mono" id="editorArquivo">personalizado.pl</span>
            </div>
            <div class="win-controls" aria-hidden="true">
              <span>_</span><span>□</span><span>×</span>
            </div>
          </header>

          <div class="win-subbar">
            <span id="editorMeta" class="mono">1 linha</span>
            <span id="editorModo" class="tag lil">Personalizado</span>
          </div>

          <div class="editor-shell">
            <label class="sr-only" for="editorCodigo">Código fonte em Prolog</label>
            <div class="gutter mono" id="editorLinhas" aria-hidden="true">1</div>
            <textarea
              id="editorCodigo"
              class="code-input mono"
              spellcheck="false"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              rows="16"
              placeholder="% Escreva seu código Prolog aqui..."
            ></textarea>
          </div>

          <footer class="win-footer editor-actions">
            <div class="action-group">
              <button id="btnCompilar" type="button" class="b verde">Compilar</button>
              <button id="btnLimpar" type="button" class="b creme">Limpar saída</button>
            </div>
          </footer>
        </article>

        <!-- COLUNA DIREITA: MÁQUINA, CONSULTA E CONSOLE -->
        <div class="ide-right">
          <!-- PAINEL 1: MÁQUINA -->
          <article class="card win win-maquina" aria-labelledby="tit-maquina">
            <header class="win-bar bg-lilas">
              <div class="win-title">
                <span class="win-icon" aria-hidden="true">⚙</span>
                <h3 id="tit-maquina">Máquina</h3>
                <span id="maquinaTag" class="tag creme">Aguardando</span>
              </div>
              <div class="win-controls" aria-hidden="true">
                <span>_</span><span>□</span><span>×</span>
              </div>
            </header>

            <div class="win-body">
              <div class="tabs machine-tabs" role="tablist" aria-label="Visualizações da Máquina">
                <button
                  type="button"
                  role="tab"
                  id="tab-tokens"
                  aria-controls="panel-tokens"
                  aria-selected="true"
                  class="tab-btn on"
                  data-tab="tokens"
                >
                  Tokens <span id="badgeTokens" class="count-pill">0</span>
                </button>
                <button
                  type="button"
                  role="tab"
                  id="tab-simbolos"
                  aria-controls="panel-simbolos"
                  aria-selected="false"
                  tabindex="-1"
                  class="tab-btn"
                  data-tab="simbolos"
                >
                  Símbolos <span id="badgeSimbolos" class="count-pill">0</span>
                </button>
                <button
                  type="button"
                  role="tab"
                  id="tab-arvore"
                  aria-controls="panel-arvore"
                  aria-selected="false"
                  tabindex="-1"
                  class="tab-btn"
                  data-tab="arvore"
                >
                  Árvore <span id="badgeArvore" class="count-pill">–</span>
                </button>
                <button
                  type="button"
                  role="tab"
                  id="tab-diagnostico"
                  aria-controls="panel-diagnostico"
                  aria-selected="false"
                  tabindex="-1"
                  class="tab-btn"
                  data-tab="diagnostico"
                >
                  Diagnóstico <span id="badgeDiag" class="count-pill">–</span>
                </button>
              </div>

              <div id="panel-tokens" class="machine-panel" role="tabpanel" aria-labelledby="tab-tokens" tabindex="0"></div>
              <div id="panel-simbolos" class="machine-panel" role="tabpanel" aria-labelledby="tab-simbolos" tabindex="0" hidden></div>
              <div id="panel-arvore" class="machine-panel" role="tabpanel" aria-labelledby="tab-arvore" tabindex="0" hidden></div>
              <div id="panel-diagnostico" class="machine-panel" role="tabpanel" aria-labelledby="tab-diagnostico" tabindex="0" hidden></div>
            </div>
          </article>

          <!-- PAINEL 2: CONSULTA -->
          <article class="card win win-consulta" aria-labelledby="tit-consulta">
            <header class="win-bar bg-rosa">
              <div class="win-title">
                <span class="win-icon" aria-hidden="true">?</span>
                <h3 id="tit-consulta">Consulta</h3>
              </div>
              <div class="win-controls" aria-hidden="true">
                <span>_</span><span>□</span><span>×</span>
              </div>
            </header>

            <div class="win-body consulta-body">
              <label for="inputConsulta" class="sr-only">Consulta Prolog</label>
              <div class="consulta-row">
                <div class="query-field">
                  <span class="query-prompt mono" aria-hidden="true">?-</span>
                  <input
                    id="inputConsulta"
                    type="text"
                    class="mono"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="Ex.: avo(joao, Neto)."
                  >
                </div>
                <button id="btnExecutar" type="button" class="b rosa">Executar consulta</button>
              </div>
            </div>
          </article>

          <!-- PAINEL 3: CONSOLE -->
          <article class="card win win-console" aria-labelledby="tit-console">
            <header class="win-bar bg-ciano">
              <div class="win-title">
                <span class="win-icon" aria-hidden="true">&gt;_</span>
                <h3 id="tit-console">Console</h3>
                <span id="consoleTag" class="tag creme">Pronto</span>
              </div>
              <div class="win-controls" aria-hidden="true">
                <span>_</span><span>□</span><span>×</span>
              </div>
            </header>

            <div class="win-body">
              <div
                id="consoleSaida"
                class="console-screen mono"
                role="region"
                aria-label="Saída do console"
                aria-live="polite"
                tabindex="0"
              ></div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <div class="retro-ribbon bottom" aria-hidden="true"></div>

  <script src="exemplos.js"></script>
  <script src="app.js"></script>
</body>
</html>
